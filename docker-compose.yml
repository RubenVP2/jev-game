# Déploiement Docker Compose / Dokploy.
# Dans Dokploy : "Create Service" → "Compose", pointez ce dépôt, puis dans l'onglet
# "Domains" associez votre domaine au service `app` sur le port 3000 (HTTPS obligatoire
# pour le micro). Aucun port n'est publié sur l'hôte : Traefik route vers le conteneur.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      KEV_URL: ${KEV_URL-http://laya:8008}
      KEV_API_KEY: ${KEV_API_KEY:-}
      KEV_TIMEOUT_MS: ${KEV_TIMEOUT_MS:-1500}
      KEV_CLUE_TIMEOUT_MS: ${KEV_CLUE_TIMEOUT_MS:-1000}
      KEV_CLUE_THRESHOLD: ${KEV_CLUE_THRESHOLD:-0}
      MIN_PLAYERS: ${MIN_PLAYERS:-4}
      ROUND_SECONDS: ${ROUND_SECONDS:-180}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    depends_on:
      - laya

  # Moteur de décision « Système 1 » : Laya multilingue (français), contrat /v1/systemone,
  # réseau interne uniquement. ~1,5 Go de RAM, ~200 ms par question sur CPU.
  # Alternative Kev (anglais, plus lourd) : docker-compose.kev.yml.
  laya:
    build:
      context: ./laya
      args:
        TORCH_INDEX: ${LAYA_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    expose:
      - "8008"
    environment:
      LAYA_SUBFOLDER: ${LAYA_SUBFOLDER:-multilingual}
      KEV_API_KEY: ${KEV_API_KEY:-}
    volumes:
      - laya-hf:/data/hf
    # GPU NVIDIA (~35 ms par question) : LAYA_TORCH_INDEX=https://download.pytorch.org/whl/cu128 et décommentez :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  laya-hf:
