# Déploiement Docker Compose / Dokploy.
# Dans Dokploy : "Create Service" → "Compose", pointez ce dépôt, puis dans l'onglet
# "Domains" associez votre domaine au service `app` sur le port 3000 (HTTPS obligatoire
# pour le micro). Aucun port n'est publié sur l'hôte : Traefik route vers le conteneur.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      KEV_URL: ${KEV_URL-http://kev:8008}
      KEV_API_KEY: ${KEV_API_KEY:-}
      KEV_TIMEOUT_MS: ${KEV_TIMEOUT_MS:-3000}
      KEV_CLUE_TIMEOUT_MS: ${KEV_CLUE_TIMEOUT_MS:-2000}
      KEV_CLUE_THRESHOLD: ${KEV_CLUE_THRESHOLD:-0}
      MIN_PLAYERS: ${MIN_PLAYERS:-4}
      ROUND_SECONDS: ${ROUND_SECONDS:-180}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    depends_on:
      - kev

  # Kev : modèle de décision « Système 1 » local (contrat /v1/systemone), réseau interne uniquement.
  kev:
    build:
      context: ./kev
      args:
        TORCH_INDEX: ${KEV_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    expose:
      - "8008"
    environment:
      KEV_RUN: ${KEV_RUN:-jaredpalmer/kev-0.6b}
      KEV_API_KEY: ${KEV_API_KEY:-}
    volumes:
      - kev-hf:/data/hf
    # GPU NVIDIA (kev-4b / kev-8b, latence ~0,1 s) : définissez
    # KEV_TORCH_INDEX=https://download.pytorch.org/whl/cu128 et décommentez :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  kev-hf:
