services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      VEILLE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    expose:
      - "8080"

  # HTTPS reverse proxy: Threads and TikTok download the slides from PUBLIC_BASE_URL.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
