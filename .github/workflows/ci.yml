name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Doctor (offline)
        run: veille doctor --offline || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t veille .
      - name: Smoke test
        run: docker run --rm veille veille demo --out /tmp/demo
